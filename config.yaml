# 黑灰产情报分析Agent系统配置文件
# All configurable parameters for the system

app:
  name: "AntiBlack"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
  debug: false
  # Token budget control
  token_budget:
    daily_limit: 1000000
    alert_threshold: 0.3  # Alert when 30% remaining
    pause_deep_channel_threshold: 0.1  # Pause deep channel at 10%

# MongoDB Configuration
mongodb:
  host: "${DB_HOST}"
  port: 27017
  database: "antiblack"

# Kafka Configuration
kafka:
  bootstrap_servers: "${KAFKA_BOOTSTRAP_SERVERS}"
  consumer_group: "antiblack_pipeline"
  topics:
    raw_messages: "raw.messages"
    cleaned_messages: "cleaned.messages"
    deep_analysis: "deep.analysis.tasks"
    image_analysis: "image.analysis.tasks"
  # Consumer settings
  consumer:
    auto_offset_reset: "earliest"
    enable_auto_commit: true
    max_poll_records: 100
  # Producer settings
  producer:
    acks: "all"
    retries: 3
    batch_size: 16384

# Cloud VLM Configuration (阿里百炼, 临时使用直到Ollama配置完成)
cloud_vlm:
  enabled: true
  api_base: "${VLM_API_BASE}"
  api_key: "${DASHSCOPE_API_KEY}"
  model: "${VLM_MODEL}"  # qwen3.6-27b

# Ollama Configuration (VLM and Embedding - 后续启用)
ollama:
  enabled: false
  base_url: "http://localhost:11434"
  vlm_model: "qwen3.6"  # Vision language model for image understanding
  embedding_model: "bge-m3"  # Ollama embedding model

# Local Models Configuration
local_models:
  # Sentence-Transformers for embeddings
  embedding:
    model_name: "BAAI/bge-small-zh-v1.5"
    device: "auto"  # auto, cpu, cuda, mps
    dimension: 512
    normalize: true

  # XGBoost classifier (path to trained model)
  classifier:
    model_type: "xgboost"  # xgboost or linear
    model_path: "./models/ml/assets/xgboost_classifier.pkl"
    label_encoder_path: "./models/ml/assets/xgboost_classifier_label_encoder.pkl"

  # FastText language detection
  fasttext:
    model_path: "./models/lid.176.bin"
    use_rule_fallback: true  # Use rule-based detection if model unavailable

  # OCR (PaddleOCR)
  ocr:
    use_angle_cls: true
    lang: "ch"  # ch, en, japan, korean, chinese_cht
    device: "cpu"  # cpu, gpu

# LightRAG Configuration (uses cloud LLM)
lightrag:
  working_dir: "./rag_storage"
  # LLM Settings (MiniMax Primary)
  llm:
    api_base: "${LLM_API_BASE}"
    api_key: "${OPENAI_API_KEY}"
    model: "${LLM_MODEL}"
    max_tokens: 8192
    temperature: 0.0
  # LLM Backup Settings (DashScope Qwen)
  llm_backup:
    api_base: "${LLM_BACKUP_API_BASE}"
    api_key: "${DASHSCOPE_API_KEY}"
    model: "${LLM_BACKUP_MODEL}"
    max_tokens: 8192
    temperature: 0.0
  # Embedding Settings (local via sentence-transformers or Ollama)
  embedding:
    model: "BAAI/bge-small-zh-v1.5"  # Local sentence-transformers
    dimension: 512
    max_token_size: 8192
  # Storage Backend
  storage:
    graph: "Neo4JStorage"
    vector: "PGVectorStorage"
    kv: "PGKVStorage"
    doc_status: "PGDocStatusStorage"
  # Neo4j Settings
  neo4j:
    uri: "${NEO4J_URI}"
    username: "neo4j"
    password: "neo4j123"
  # PostgreSQL Settings (for vector storage)
  postgresql:
    host: "${POSTGRES_HOST}"
    port: 5432
    user: "antiblack"
    password: "antiblack123"
    database: "antiblack"

# Pipeline Configuration
pipeline:
  # Routing threshold (0.0 - 1.0)
  routing:
    default_threshold: 0.6
    token_adjusted_threshold: 0.7  # When token budget low
  # Light channel (rule-based extraction)
  light_channel:
    max_processing_time_ms: 5
  # Deep channel (LightRAG)
  deep_channel:
    max_parallel_workers: 3
    max_tokens_per_insert: 5000
  # Collection
  collection:
    default_interval_seconds: 900  # 15 minutes
    max_messages_per_batch: 100
  # Cleaning
  cleaning:
    dedup_window_hours: 24
    simhash_threshold: 3  # Hamming distance for approximate dedup
  # Classification
  classification:
    rule_confidence_threshold: 0.7
    embedding_confidence_threshold: 0.6
    llm_fallback_confidence: 0.6

# Slang Learning Module
slang_learning:
  # State machine thresholds
  thresholds:
    new_to_observed: 10      # NEW -> OBSERVED
    observed_to_likely: 20    # OBSERVED -> LIKELY
    likely_to_confirmed: 20   # LIKELY -> CONFIRMED (lowered for testing)
    stable_count: 500         # CONFIRMED -> STABLE
  # Reject settings
  reject:
    silence_days: 30
    max_retries: 3
  # Token control
  token_control:
    batch_size: 20
    dynamic_threshold_factor: 1.5  # Multiply threshold when token budget low
  # 淘汰与回测配置 (Elimination and Backtesting)
  elimination:
    # 2026-06-02 沙盘: 之前 min_occurrences=200 导致 0 candidates 触发 demote (所有
    # CONFIRMED 都 < 200 occ). 调低到 100 让 demote 真正生效 (只有 账号出售 occ=122
    # 在 100-200 区间, 1 个真实 slang 受影响, 低误杀风险).
    min_occurrences: 100
    # 2026-06-02 沙盘: min_hit_rate 0.05 → 0.10 对当前数据 ZERO 影响 (瓶颈在 occ
    # 不是 hit_rate). 保持 0.05 兜底.
    min_hit_rate: 0.05
    backtest_threshold: 0.6
    backtest_timeout_seconds: 0.5

# Auto Evolution Module
auto_evolution:
  enabled: true
  # Silver sample collection
  silver:
    min_confidence: 0.8
  # Error book (LLM-as-Judge)
  error_book:
    sample_rate: 0.01  # 1% of high-confidence messages
    judge_model: "gpt-4o"
  # Retraining
  retrain:
    trigger_threshold: 2000
    test_split_ratio: 0.2
    min_f1_improvement: 0.02
  # Schedule
  schedule:
    error_book_check_hour: 2  # 2 AM daily
    retrain_check_interval_hours: 12

# Taxonomy (Risk Classification System)
taxonomy:
  version: "taxonomy_v1"
  categories:
    - level1_code: "ACCOUNT_TRADE"
      level1_name: "账号交易"
      level2_items:
        - level2_code: "DOUYIN_ACCOUNT_SALE"
          level2_name: "抖音号买卖"
        - level2_code: "ACCOUNT_RENTAL"
          level2_name: "账号租借"
        - level2_code: "ACCOUNT_TRANSFER"
          level2_name: "账号转让"
    - level1_code: "FRAUD_LEADS"
      level1_name: "诈骗引流"
      level2_items:
        - level2_code: "BRUSH_ORDER"
          level2_name: "刷单引流"
        - level2_code: "PIG_BUTCHER"
          level2_name: "杀猪盘"
        - level2_code: "PART_TIME_FRAUD"
          level2_name: "兼职诈骗"
    - level1_code: "TRAFFIC_CHEATING"
      level1_name: "流量作弊"
      level2_items:
        - level2_code: "FAKE_FOLLOWERS"
          level2_name: "刷粉"
        - level2_code: "FAKE_LIKES"
          level2_name: "刷赞"
        - level2_code: "FAKE_VIEWS"
          level2_name: "刷播放量"
    - level1_code: "BLACK_TOOL"
      level1_name: "黑产工具"
      level2_items:
        - level2_code: "PHONE_OTP"
          level2_name: "接码平台"
        - level2_code: "BATCH_CONTROL"
          level2_name: "群控工具"
    - level1_code: "UNKNOWN"
      level1_name: "未知/其他"
      level2_items:
        - level2_code: "UNCATEGORIZED"
          level2_name: "未分类"

# Seed Words Configuration
seed_words:
  default_source: "preset"
  effective_ratio_threshold: 0.05  # Effective clue ratio threshold
  degradation_days: 7

# Channel Configuration
channels:
  supported:
    - platform: "telegram"
      category: "im"
      enabled: true
    - platform: "x"
      category: "social"
      enabled: false
    - platform: "baidu_tieba"
      category: "social"
      enabled: true
    - platform: "douyin"
      category: "social"
      enabled: true
    - platform: "rednote"
      category: "social"
      enabled: false
    - platform: "secondhand"
      category: "vertical"
      enabled: false
    - platform: "zhilian"
      category: "vertical"
      enabled: false
    - platform: "darkweb"
      category: "vertical"
      enabled: false
    - platform: "tech_forum"
      category: "vertical"
      enabled: false

# Telegram Configuration (MTProto passive listening)
telegram:
  enabled: true
  account_id: 1
  api_id: "${TELEGRAM_API_ID}"       # Get from https://my.telegram.org
  api_hash: "${TELEGRAM_API_HASH}"   # Get from https://my.telegram.org
  phone: "${TELEGRAM_PHONE}"        # Your Telegram phone number
  # Keyword matching
  keyword_refresh_interval: 900     # 15 minutes
  pipeline_batch_size: 100          # Messages per pipeline batch

# MediaCrawler Configuration
media_crawler:
  enabled: true
  # Database connection (MediaCrawler's PostgreSQL on remote VM)
  database:
    host: "${POSTGRES_HOST}"
    port: 5432
    user: "antiblack"
    password: "antiblack123"
    database: "media_crawler"
  # Polling interval in seconds
  poll_interval: 60
  # Platforms to crawl
  platforms:
    - name: "douyin"
      keywords:
        - "出抖号"
        - "抖音号买卖"
        - "加V"
        - "千粉"
        - "微信号"
      enabled: true
    - name: "baidu_tieba"
      keywords:
        - "出抖号"
        - "抖音号买卖"
        - "加微"
        - "刷粉"
      enabled: true
    - name: "xhs"
      keywords:
        - "出抖号"
        - "抖音号买卖"
        - "加V"
        - "千粉"
        - "微信号"
      enabled: true
    - name: "ks"
      keywords:
        - "出抖号"
        - "抖音号买卖"
        - "加V"
        - "千粉"
        - "微信号"
      enabled: true
    - name: "weibo"
      keywords:
        - "出抖号"
        - "抖音号买卖"
        - "加V"
        - "千粉"
        - "微信号"
      enabled: true
  #采集评论
  enable_comments: true

# Daemon Configuration (24/7 Background Patrol)
daemon:
  enabled: true
  # Collection schedule
  collection_interval_seconds: 900      # 15 minutes
  # Slang evolution schedule
  slang_evolution_interval_seconds: 3600  # 1 hour
  # LLM error book sampling schedule
  error_book_check_hour: 2              # 2 AM daily
  # Model retraining schedule
  retrain_check_interval_hours: 12
  # Telegram pipeline schedule (check for unprocessed messages)
  telegram_pipeline_interval_seconds: 300  # 5 minutes
  # Log file
  log_file: "./logs/antiblack_daemon.log"
  # Browser automation (for platforms requiring login)
  browser_automation:
    enabled: false
    chrome_ws_url: "ws://127.0.0.1:9222/devtools/browser"
    click_on_start: true
    page_url: "http://127.0.0.1:8000/crawler"
  # Platform list for collection
  platforms:
    - douyin
    - tieba
    - xhs
    - ks
    - weibo

# Monitoring Configuration
monitoring:
  metrics:
    enabled: true
    retention_days: 30
  health_check:
    interval_seconds: 60
    timeout_seconds: 10

# Export Configuration
export:
  max_records_per_export: 5000
  download_url_expiry_hours: 24
  formats:
    - "json"
    - "csv"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/antiblack.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5