# AntiBlack 一键部署配置文件
# 使用: docker-compose up -d

services:
  # MongoDB 8.0 - 主数据库
  mongodb:
    image: mongo:8.0.23-noble
    container_name: antiblack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: antiblack
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antiblack-net

  # Kafka 4.2 with KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:4.3.0
    container_name: antiblack-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.147:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - antiblack-net

  # Neo4j 5.26.26 (LTS) - 图数据库
  neo4j:
    image: neo4j:5.26.26-community
    container_name: antiblack-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/neo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_connector_http_advertised__address: localhost:7474
      NEO4J_dbms_connector_bolt_advertised__address: localhost:7687
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antiblack-net

  # PostgreSQL 17 + pgvector
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: antiblack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: antiblack
      POSTGRES_USER: antiblack
      POSTGRES_PASSWORD: antiblack123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiblack -d antiblack"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - antiblack-net

  # Redis 7.2.14-alpine - 缓存
  redis:
    image: redis:7.4.9
    container_name: antiblack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - antiblack-net

volumes:
  mongodb_data:
  kafka_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
  redis_data:

networks:
  antiblack-net:
    driver: bridge
